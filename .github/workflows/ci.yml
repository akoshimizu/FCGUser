name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# 1. PERMISSÃO OBRIGATÓRIA PARA O OIDC DO GITHUB
permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore UserAPI.slnx

      - name: Build
        run: dotnet build UserAPI.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test UserAPI.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx

      # --- ETAPAS DE TESTE DO OIDC E ECR ---

      - name: Diagnosticar Claims OIDC
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
      
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
      
            console.log('Issuer:', payload.iss);
            console.log('Audience:', payload.aud);
            console.log('Subject:', payload.sub);

      - name: Autenticar na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::432342421632:role/GithubActionsOidcRole
          aws-region: us-east-1

      - name: Testar Build da Imagem Docker (Sem Push)
        run: |
          echo "Build finalizado com sucesso! (Push desativado propositalmente)"
